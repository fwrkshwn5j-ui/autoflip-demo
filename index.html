<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0c1420">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>AUTOFLIP — Garage Empire · 0.2</title>
<style>
:root{--bg:#09121d;--panel:#121e2c;--card:#172638;--stroke:#304457;--text:#f5f7fb;--muted:#a2b5c7;--accent:#d9ff58;--mint:#5be5ba;--danger:#ff8491;--orange:#ffca77;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
body{overflow-x:hidden;background:radial-gradient(ellipse at 40% -5%,#234154 0,transparent 50%),#09121d}
button{font:inherit;touch-action:manipulation;cursor:pointer}button:disabled{cursor:default;opacity:.43}
.shell{max-width:550px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px calc(105px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0 19px}
.brand{font-style:italic;font-weight:1000;letter-spacing:-1.5px;font-size:28px;line-height:1}.brand span{color:var(--accent)}
.brand small{font-size:9px;display:block;color:#9fb3bc;letter-spacing:2px;font-style:normal;margin-top:5px}
.wallet{background:#162637;border:1px solid #3b5665;border-radius:14px;padding:9px 12px;text-align:right;min-width:124px;box-shadow:0 4px 30px #0003}
.wallet small{display:block;color:#c6d1d6;font-size:10px;font-weight:800;letter-spacing:1px}.wallet b{font-size:18px;color:var(--accent);font-variant-numeric:tabular-nums}
.eyebrow{font-size:10px;letter-spacing:2px;font-weight:1000;color:var(--accent);text-transform:uppercase;margin-bottom:5px}
h1{margin:0;font-size:29px;letter-spacing:-.8px;line-height:1.1;font-weight:950}h2{font-size:19px;letter-spacing:-.4px;margin:0}h3{font-size:17px;margin:0}
.sub{color:var(--muted);font-size:13px;line-height:1.55;margin:9px 0 17px}
.card{border:1px solid var(--stroke);border-radius:22px;background:linear-gradient(154deg,#1a2b3b 0,#13202f 90%);overflow:hidden;box-shadow:0 18px 38px #0004;margin-bottom:14px}
.pad{padding:17px}.overline{font-size:10px;letter-spacing:1.5px;font-weight:900;color:#92a9bf;text-transform:uppercase}
.frow{display:flex;align-items:center;justify-content:space-between;gap:10px}.srow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:4px;background:#283b4d;border:1px solid #466076;border-radius:99px;padding:5px 9px;font-size:10px;font-weight:850;color:#e0eefa}
.pill.lime{background:#34472c;color:var(--accent);border-color:#627e3c}.pill.coral{background:#4c313f;color:#ffb4c1;border-color:#895563}
.stage{height:228px;background:linear-gradient(180deg,#48657d 0%,#2b485a 43%,#202f3d 44%,#101a27 85%);position:relative;overflow:hidden;isolation:isolate}
.stage:before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 75% 15%,#ffc76b66,transparent 42%),linear-gradient(90deg,transparent 48%,#91c4d014 50%,transparent 52%);z-index:-1}
.stage:after{content:'';position:absolute;bottom:0;left:-20%;width:140%;height:32%;background:repeating-linear-gradient(90deg,#ffffff08 0 2px,transparent 2px 95px),linear-gradient(180deg,#1c2833,#09131b);transform:perspective(270px) rotateX(16deg);transform-origin:bottom}
.skyline{position:absolute;bottom:40%;left:0;width:100%;height:46%;opacity:.42;background:linear-gradient(to top,#162431 70%,transparent 71%),linear-gradient(90deg,transparent 6%,#152534 6% 18%,transparent 18% 21%,#192a3a 21% 34%,transparent 34% 39%,#132634 39% 53%,transparent 53% 56%,#17283a 56% 72%,transparent 72% 76%,#1a2c38 76% 90%,transparent 90%);clip-path:polygon(0 43%,7% 43%,7% 10%,17% 10%,17% 38%,23% 38%,23% 0,35% 0,35% 45%,42% 45%,42% 14%,53% 14%,53% 50%,60% 50%,60% 8%,72% 8%,72% 40%,79% 40%,79% 20%,93% 20%,93% 53%,100% 53%,100% 100%,0 100%)}
.light{position:absolute;top:12px;left:14px;z-index:2}.lot{position:absolute;top:12px;right:13px;z-index:2}.car-svg{width:100%;height:100%;display:block;position:absolute;inset:0;filter:drop-shadow(0 13px 10px #0008)}
.stage.sm{height:175px}.stage.sm .car-svg{transform:scale(.95)}
.stage.garage-stage{background:linear-gradient(#41566b 0 47%,#203043 48%,#14202b 100%)}
.stage .stencil{position:absolute;bottom:7px;right:13px;font-weight:1000;font-size:38px;font-style:italic;color:#ffffff16;z-index:1;letter-spacing:-2px}
.pricebox{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:15px 0}.pricebox>div{padding:13px;background:#0d1b2a;border:1px solid #304455;border-radius:14px}.pricebox small{display:block;font-size:9px;letter-spacing:.8px;color:#afc0cf;font-weight:850;margin-bottom:5px}.pricebox strong{font-size:19px;letter-spacing:-.6px}.lime-text{color:var(--accent)}.mint-text{color:var(--mint)}.red-text{color:var(--danger)}
.muted{color:var(--muted);font-size:12px;line-height:1.5}.car-name{font-size:23px;letter-spacing:-.6px;font-weight:950;margin:3px 0 4px}.meta{font-size:12px;color:#b5c6d2}
.btn{appearance:none;border:0;border-radius:14px;background:var(--accent);color:#1e2a19;padding:14px 13px;min-height:47px;font-weight:950;letter-spacing:-.2px;box-shadow:0 4px 0 #829d30;transition:transform .1s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #829d30}.btn.alt{background:#2b4358;color:#f2f7ff;box-shadow:0 3px 0 #142537;border:1px solid #587089}.btn.mint{background:var(--mint);box-shadow:0 3px 0 #29896e}.btn.ghost{background:transparent;border:1px solid #456075;color:#d1e1ea;box-shadow:none}.btn.wide{width:100%}.btn.small{font-size:12px;padding:10px;min-height:40px;border-radius:11px}.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:11px}.btnrow.triple{grid-template-columns:1fr 1fr 1fr}
.notice{padding:12px 14px;border-radius:13px;background:#1d303b;border:1px solid #3c5d65;color:#d8e7e5;font-size:12px;line-height:1.55;margin:12px 0}.notice.warn{background:#352d2c;border-color:#6c5540}
.titlebar{display:flex;justify-content:space-between;align-items:center;margin:23px 0 9px;gap:12px}.titlebar h2{font-size:17px}
.bidmeter{display:flex;gap:6px;align-items:center;margin-top:13px}.bidmeter .dot{height:6px;flex:1;background:#355064;border-radius:5px}.bidmeter .dot.on{background:var(--accent)}
.report-item{display:flex;align-items:center;justify-content:space-between;gap:7px;padding:9px 0;border-bottom:1px solid #2d4352;font-size:12px}.report-item:last-child{border:0}.report-item b{white-space:nowrap}
.mini-note{font-size:11px;color:#b9cdd9;line-height:1.5;margin:10px 0}
.stat{margin:13px 0}.stat>div:first-child{display:flex;justify-content:space-between;font-size:12px;gap:8px;margin-bottom:6px}.bar{height:8px;border-radius:9px;background:#314456;overflow:hidden}.bar i{height:100%;display:block;border-radius:9px;background:linear-gradient(90deg,#46bdb4,#d9ff58)}.bar i.bad{background:linear-gradient(90deg,#a86055,#ff9b75)}
.repair{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:12px 0;border-bottom:1px solid #2c4051}.repair>div{flex:1;min-width:0}.repair b{font-size:12px}.repair small{font-size:10px;color:#aac1ce;display:block;margin-top:3px}
.grime{position:absolute;z-index:5;width:34px;height:34px;border:1px dashed #c0d5d8b9;border-radius:50%;background:#9b715a9e;box-shadow:0 0 0 5px #76503e32,0 0 12px #0006;color:white;font-size:13px;font-weight:900;animation:pulse 1.6s infinite alternate}.grime:after{content:'✦';position:absolute;top:7px;left:9px;color:#ffe9b5}.grime:active{transform:scale(.82)}@keyframes pulse{to{box-shadow:0 0 0 9px #76503e22}}
.grime.g1{left:20%;top:52%}.grime.g2{left:36%;top:40%}.grime.g3{left:59%;top:57%}.grime.g4{left:75%;top:46%}
.scorecard{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.scorecard>div{background:#182a39;border:1px solid #334c5e;border-radius:13px;padding:11px 9px;text-align:center}.scorecard b{display:block;font-size:18px}.scorecard small{font-size:10px;color:#adbfcb}
.upgrade{display:flex;gap:13px;align-items:center;padding:15px 0;border-bottom:1px solid #293d51}.upgrade:last-child{border-bottom:0}.upicon{width:47px;height:47px;display:grid;place-items:center;background:#293e4b;border:1px solid #445c68;border-radius:14px;font-size:23px;flex:none}.upgrade .copy{flex:1;min-width:0}.upgrade .copy b{font-size:13px}.upgrade .copy p{margin:4px 0 0;color:#adc0cc;font-size:11px;line-height:1.4}
.log{font-size:12px;display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid #304153}.log:last-child{border:0}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:40;background:#0c1928ed;border-top:1px solid #3d5366;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:9px max(12px,env(safe-area-inset-right)) calc(9px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
.nav-wrap{max-width:550px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.nav button{border:0;background:transparent;color:#8fa6b7;border-radius:12px;padding:7px 3px;min-height:57px;font-size:10px;font-weight:850}.nav button span{font-size:22px;display:block;line-height:1.3}.nav button.active{background:#344734;color:var(--accent);box-shadow:inset 0 0 0 1px #647c42}
#toast{position:fixed;z-index:101;bottom:calc(99px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,14px);max-width:calc(100vw - 25px);width:max-content;padding:13px 17px;border-radius:13px;background:#e6fcb8;color:#24351f;font-size:13px;font-weight:800;box-shadow:0 15px 40px #0008;opacity:0;pointer-events:none;transition:.2s;line-height:1.35}#toast.show{opacity:1;transform:translate(-50%,0)}
.modalbg{position:fixed;inset:0;z-index:90;background:#030912ca;display:flex;align-items:flex-end;justify-content:center;padding:12px}.modal{width:min(520px,100%);background:#192939;border:1px solid #587085;border-radius:22px;padding:22px;box-shadow:0 12px 80px #000c;margin-bottom:env(safe-area-inset-bottom)}.modal h2{font-size:22px;margin:0 0 9px}.modal p{color:#c1d3de;font-size:13px;line-height:1.65;margin:0}.modal .btnrow{margin-top:20px}
@media(min-width:600px){.nav{left:50%;right:auto;width:550px;transform:translateX(-50%);border-left:1px solid #34495e;border-right:1px solid #34495e;border-radius:18px 18px 0 0}.stage{height:245px}}
@media(max-width:355px){h1{font-size:26px}.wallet b{font-size:16px}.btn{font-size:12px}.pricebox strong{font-size:16px}.brand{font-size:24px}.pill{font-size:9px}}
</style>
</head>
<body>
<div class="shell" id="app"></div><nav class="nav" id="nav" aria-label="Spielnavigation"></nav><div id="toast" role="status" aria-live="polite"></div><div id="popup"></div>
<script>
(()=>{'use strict';
const KEY='autoflip-v02-save',OLD='autoflip-v01-save';
const CARS=[
 {name:'Kavo Urban',class:'City Hatch',value:7800,color:'#e9a943',shape:'compact'},
 {name:'Nordline 160',class:'Business Sedan',value:12300,color:'#6bc7d4',shape:'sedan'},
 {name:'Vexa GT',class:'Sportcoupé',value:18900,color:'#ed6f6f',shape:'sport'},
 {name:'Ravon X4',class:'SUV',value:25400,color:'#93bd8b',shape:'suv'},
 {name:'Falcon RS',class:'Supersport',value:43500,color:'#b6a0f5',shape:'sport'},
 {name:'Veloré Classic',class:'Oldtimer',value:32700,color:'#cf996d',shape:'sedan'}
];
const PARTS=[{id:'motor',name:'Motor & Getriebe',icon:'⚙️',r:.34,w:.43},{id:'body',name:'Karosserie & Lack',icon:'🎨',r:.19,w:.34},{id:'electro',name:'Elektronik',icon:'⚡',r:.13,w:.23}];
const money=n=>Math.round(n).toLocaleString('de-DE')+' €',rand=(a,b)=>Math.floor(a+Math.random()*(b-a+1)),round50=n=>Math.round(n/50)*50,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let screen='auction',modal=null,toastTimer=null;
function fresh(){return{cash:12500,garage:[],capacity:2,inspector:0,sales:0,profit:0,turn:0,offer:null,nextid:1,history:[],inspections:0,cleaned:0,best:0,upgrades:0}}
function migrate(){try{const existing=localStorage.getItem(KEY);if(existing){let o=JSON.parse(existing);if(o&&Number.isFinite(o.cash)&&Array.isArray(o.garage))return {...fresh(),...o}}let old=JSON.parse(localStorage.getItem(OLD)||'null');if(!old||!Number.isFinite(old.cash)||!Array.isArray(old.garage))return fresh();return {...fresh(),cash:old.cash,capacity:old.capacity||2,inspector:old.inspector||0,sales:old.sales||0,profit:old.profit||0,turn:old.turn||0,nextid:old.nextid||1,history:(old.history||[]).slice(0,12),garage:old.garage.map(c=>({...c,spots:4,cleaned:false,negotiated:false})),inspections:0}}catch(e){return fresh()}}
let s=migrate();
function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}
function condition(parts){return PARTS.reduce((total,p)=>total+(parts[p.id]||0)*p.w,0)}
function saleVal(c){const m=CARS[c.model];let base=round50(m.value*(.21+.79*condition(c.parts)/100)*(c.valueFactor||1));return base+(c.cleaned?400:0)}
function repairPrice(c,p){return Math.round((CARS[c.model].value*p.r*(100-c.parts[p.id])/100+100)/10)*10}
function nextOffer(){let eligible=CARS.map((c,i)=>({...c,i})).filter(c=>c.value*.53<s.cash*1.25);if(!eligible.length)eligible=CARS.slice(0,2).map((c,i)=>({...c,i}));let m=eligible[rand(0,eligible.length-1)];const parts={motor:rand(27,95),body:rand(25,94),electro:rand(27,97)},cond=condition(parts),base=round50(m.value*(.29+.44*cond/100)*(rand(90,104)/100));s.offer={id:s.nextid++,model:m.i,parts,price:base,bid:base,step:m.value>20000?500:250,leader:'market',round:0,inspected:false,inspectionFee:0,valueFactor:rand(97,104)/100,mileage:rand(35,225)*1000,note:['Verkauf aus Privatbesitz – ohne Garantie.','Stand lange in einer Garage.','Fahrbereit laut Verkäufer.','Lack glänzt, Technik unbekannt.','Schneller Verkauf aus Nachlass.'][rand(0,4)]};s.turn++;save()}
if(!s.offer)nextOffer();
function notif(t){let el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3100)}
function carSVG(car){const m=CARS[car.model]||CARS[0],t=m.shape,body=m.color,uid='v'+Math.abs(car.id||1)+'-'+Math.floor(Math.random()*99999),isSUV=t==='suv',isSport=t==='sport',roof=isSUV?'M168 120 L205 72 Q213 65 231 65 L343 65 Q357 65 366 81 L405 120 Z':isSport?'M162 127 L223 92 Q232 85 250 85 L331 87 Q345 89 357 102 L382 126 Z':'M167 125 L214 79 Q220 71 237 71 L329 71 Q344 71 351 84 L393 125 Z';return `<svg class="car-svg" viewBox="0 0 540 255" xmlns="http://www.w3.org/2000/svg" aria-label="Illustration eines ${m.class}"><defs><linearGradient id="paint${uid}" x1="0" y1="0" x2=".16" y2="1"><stop stop-color="#ffffff" stop-opacity=".65"/><stop offset=".22" stop-color="${body}"/><stop offset=".65" stop-color="${body}"/><stop offset="1" stop-color="#111928"/></linearGradient><linearGradient id="glass${uid}" x1="0" y1="0" x2=".4" y2="1"><stop stop-color="#d9f2ff" stop-opacity=".94"/><stop offset=".4" stop-color="#7399b2"/><stop offset="1" stop-color="#1b3349"/></linearGradient><linearGradient id="road${uid}" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#080f13" stop-opacity="0"/><stop offset=".5" stop-color="#081015" stop-opacity=".8"/><stop offset="1" stop-color="#080f13" stop-opacity="0"/></linearGradient></defs><ellipse cx="270" cy="200" rx="224" ry="26" fill="url(#road${uid})"/><path d="M96 165 Q102 133 146 126 L168 120 ${roof.slice(1)} L424 127 Q457 134 463 157 L472 178 Q470 191 452 194 L103 193 Q85 190 87 177 Z" fill="url(#paint${uid})" stroke="#0b1823" stroke-width="5"/><path d="${roof}" fill="url(#glass${uid})" stroke="#253e54" stroke-width="5"/><path d="M270 ${isSport?88:73} L270 124" stroke="#1e3b50" stroke-width="5"/><path d="M169 129 Q285 138 432 129" stroke="#f3ffff" stroke-opacity=".25" stroke-width="3" fill="none"/><path d="M101 161 L467 161" stroke="#0d1d27" stroke-opacity=".35" stroke-width="2"/><path d="M117 167 L155 162 L153 177 L110 180 Z" fill="#ffe69b" stroke="#f9f6e3" stroke-width="2"/><path d="M437 165 L463 168 L466 182 L432 180 Z" fill="#e6534b" stroke="#ffd1a6" stroke-width="2"/><path d="M101 190 L456 190" stroke="#101820" stroke-width="8"/><path d="M179 194 A35 35 0 1 0 179 193 M401 194 A35 35 0 1 0 401 193" stroke="#101b23" stroke-width="30" fill="none"/><circle cx="179" cy="194" r="23" fill="#202b37" stroke="#869ba5" stroke-width="7"/><circle cx="401" cy="194" r="23" fill="#202b37" stroke="#869ba5" stroke-width="7"/><circle cx="179" cy="194" r="8" fill="#bac6cf"/><circle cx="401" cy="194" r="8" fill="#bac6cf"/><path d="M170 194 L188 194 M179 185 L179 203 M392 194 L410 194 M401 185 L401 203" stroke="#6e8190" stroke-width="3"/><path d="M290 144 L314 144" stroke="#e0f8ff" stroke-width="3" stroke-linecap="round"/></svg>`}
function scene(car,garage=false){let washes=(garage&&!car.cleaned)?Array.from({length:clamp(car.spots??4,0,4)},(_,i)=>`<button type="button" aria-label="Schmutzstelle entfernen" class="grime g${i+1}" data-a="wash" data-id="${car.id}"></button>`).join(''):'';return `<div class="stage ${garage?'sm garage-stage':''}"><div class="skyline"></div>${carSVG(car)}<span class="stencil">AUTOFLIP</span><div class="light"><span class="pill lime">${garage?'● DEINE GARAGE':'● LIVE-AUKTION'}</span></div><div class="lot"><span class="pill">${(CARS[car.model]||CARS[0]).class}</span></div>${washes}</div>`}
function head(){return `<header class="top"><div class="brand">AUTO<span>FLIP</span><small>GARAGE EMPIRE / ALPHA 0.2</small></div><div class="wallet"><small>DEIN KAPITAL</small><b>${money(s.cash)}</b></div></header>`}
function report(car){return `<div class="notice"><div class="overline" style="color:var(--mint)">✓ Prüfbericht – tatsächlicher Zustand</div>${PARTS.map(p=>`<div class="report-item"><span>${p.icon} ${p.name}</span><b class="${car.parts[p.id]<50?'red-text':'mint-text'}">${car.parts[p.id]} / 100</b></div>`).join('')}</div>`}
function auction(){let c=s.offer,m=CARS[c.model],leader=c.leader==='rival'?'🔴 Konkurrent führt':'🔔 Gebot offen';return `<div class="eyebrow">Fahrzeugauktion · Los #${String(s.turn).padStart(3,'0')}</div><h1>Der nächste große Deal.</h1><p class="sub">Prüfen, mitbieten, Risiko eingehen – oder lieber auf das nächste Auto warten.</p><section class="card">${scene(c)}<div class="pad"><div class="frow"><div><h2 class="car-name">${m.name}</h2><div class="meta">${c.mileage.toLocaleString('de-DE')} km · ${c.note}</div></div></div><div class="pricebox"><div><small>AKTUELLES GEBOT</small><strong class="lime-text">${money(c.bid)}</strong></div><div><small>TOP-MARKTWERT*</small><strong>${money(m.value)}</strong></div></div><div class="frow"><span class="pill ${c.leader==='rival'?'coral':''}">${leader}</span><span class="muted">Bietrunde ${c.round+1}</span></div><div class="bidmeter">${[0,1,2,3].map(n=>`<i class="dot ${n<=Math.min(3,c.round)?'on':''}"></i>`).join('')}</div><div class="mini-note">*Top-Wert bei sehr gutem Zustand. Versteckte Mängel können deinen Gewinn stark reduzieren.</div>${c.inspected?report(c):`<div class="notice warn">🔍 Motor, Lack und Elektronik sind noch unbekannt. Die Prüfung kostet <b>${money(Math.max(90,240-s.inspector*50))}</b>.</div>`}<div class="btnrow"><button class="btn alt" data-a="inspect" ${c.inspected?'disabled':''}>${c.inspected?'✓ Geprüft':'🔍 Prüfen'}</button><button class="btn" data-a="bid">+ ${money(c.step)} bieten</button></div><div class="btnrow"><button class="btn ghost small" data-a="skip">↻ Anderes Los</button><button class="btn ghost small" data-a="bigbid">+ ${money(c.step*2)} bieten</button></div></div></section><div class="notice">💡 <b>Spielregel:</b> Nach jedem Gebot kann ein Konkurrent erhöhen. Hört er auf, bekommst du den Zuschlag. Du kannst jederzeit aussteigen.</div>`}
function garageCard(c){let m=CARS[c.model],value=saleVal(c),invest=c.basis||c.price,profit=value-invest,remaining=clamp(c.spots??4,0,4);return `<article class="card">${scene(c,true)}<div class="pad"><div class="frow"><div><h3>${m.name}</h3><div class="muted">Einkauf: ${money(c.price)} · Gesamtaufwand: ${money(invest)}</div></div><span class="pill ${profit>=0?'lime':'coral'}">${profit>=0?'+':''}${money(profit)}</span></div>${!c.cleaned?`<div class="notice">🧽 <b>Aufbereitung:</b> Tippe oben auf die ${remaining} Schmutzstellen am Auto. Ein sauberes Fahrzeug ist ca. <b>400 €</b> mehr wert.</div>`:`<div class="notice" style="color:var(--mint)">✓ Fahrzeug aufbereitet! Der Verkaufswert ist gestiegen.</div>`}<div class="titlebar"><h2>Werkstatt</h2><span class="pill">${Math.round(condition(c.parts))}% Zustand</span></div>${PARTS.map(p=>`<div class="stat"><div><span>${p.icon} ${p.name}</span><b>${c.parts[p.id]}%</b></div><div class="bar"><i class="${c.parts[p.id]<45?'bad':''}" style="width:${c.parts[p.id]}%"></i></div></div><div class="repair"><div><b>${p.name} verbessern</b><small>Teilreparatur +${Math.min(30,100-c.parts[p.id])} · Komplettreparatur auf 100%</small></div><button class="btn alt small" data-a="repair-menu" data-id="${c.id}" data-part="${p.id}" ${c.parts[p.id]>=100?'disabled':''}>🛠 Reparieren</button></div>`).join('')}<div class="pricebox"><div><small>VERKAUFSWERT</small><strong>${money(value)}</strong></div><div><small>ERWARTETE MARGE*</small><strong class="${profit>=0?'mint-text':'red-text'}">${profit>=0?'+':''}${money(profit)}</strong></div></div><div class="btnrow"><button class="btn alt" data-a="sell" data-id="${c.id}">Sofort verkaufen</button><button class="btn mint" data-a="negotiate" data-id="${c.id}" ${c.negotiated?'disabled':''}>💬 Verhandeln</button></div><div class="mini-note">*Die Marge berücksichtigt Einkauf, Prüfung dieses Fahrzeugs und Reparaturen, aber nicht sämtliche allgemeinen Betriebsausgaben. Ein Sofortverkauf bringt 94% des geschätzten Verkaufswerts. Bei einer erfolgreichen Verhandlung gibt es 106%.</div></div></article>`}
function garage(){return `<div class="eyebrow">Werkstatt & Aufbereitung</div><h1>Aus alt mach wertvoll.</h1><p class="sub">Reinige die Autos selbst. Entscheide, welche Reparaturen sich lohnen – und verhandele beim Verkauf.</p><div class="scorecard"><div><b>${s.garage.length}/${s.capacity}</b><small>Stellplätze</small></div><div><b>${s.sales}</b><small>Verkäufe</small></div><div><b>${s.cleaned||0}</b><small>Aufbereitet</small></div></div>${s.garage.length?s.garage.map(garageCard).join(''):`<div class="card pad"><h2>Die Garage ist noch leer.</h2><p class="sub">Biete auf ein Fahrzeug in der Auktion, um hier mit der Aufbereitung zu beginnen.</p><button class="btn wide" data-a="tab" data-tab="auction">Zur Auktion →</button></div>`}`}
function empire(){let cap=4500+(s.capacity-2)*3100,diag=2800+s.inspector*1850;return `<div class="eyebrow">Dein Autohandel</div><h1>Vom Händler zum Imperium.</h1><p class="sub">Verbessere deine Garage, entwickle deine Strategie und sieh, wie deine Firma wächst.</p><div class="scorecard"><div><b>${s.sales}</b><small>Verkäufe</small></div><div><b class="${s.profit>=0?'mint-text':'red-text'}">${money(s.profit)}</b><small>Handelsmargen</small></div><div><b>${s.capacity}</b><small>Garagenplätze</small></div></div><section class="card pad"><h2>Deine Upgrades</h2><div class="upgrade"><div class="upicon">🏬</div><div class="copy"><b>Größere Garage</b><p>Ein weiterer Stellplatz für größere Fahrzeugbestände.</p></div><button class="btn alt small" data-a="upgrade" data-type="capacity">${money(cap)}</button></div><div class="upgrade"><div class="upicon">🔬</div><div class="copy"><b>Bessere Diagnose</b><p>Prüfungen werden dauerhaft günstiger. Level ${s.inspector}/3.</p></div><button class="btn alt small" data-a="upgrade" data-type="inspector" ${s.inspector>=3?'disabled':''}>${s.inspector>=3?'MAX':money(diag)}</button></div></section><section class="card pad"><h2>Meilensteine</h2>${[{done:s.sales>=1,t:'Erster Fahrzeugverkauf',desc:'Dein erster Deal ist abgeschlossen.'},{done:s.cleaned>=1,t:'Detailing-Profi',desc:'Ein Auto komplett gereinigt.'},{done:s.profit>=5000,t:'5.000 € Handelsgewinn',desc:'Erziele insgesamt 5.000 € positive Handelsmarge.'}].map(x=>`<div class="repair"><div><b>${x.done?'✅':'◻️'} ${x.t}</b><small>${x.desc}</small></div></div>`).join('')}</section><section class="card pad"><div class="frow"><h2>Letzte Verkäufe</h2><span class="pill">${s.sales} Deals</span></div>${s.history.length?s.history.slice(0,6).map(h=>`<div class="log"><span>${h.name||'Fahrzeug'}</span><b class="${(h.profit||0)>=0?'mint-text':'red-text'}">${h.profit>=0?'+':''}${money(h.profit||0)}</b></div>`).join(''):`<p class="muted">Noch keine abgeschlossenen Verkäufe.</p>`}</section><div class="btnrow"><button class="btn alt small" data-a="job">🧽 Nebenauftrag · +450 €</button><button class="btn ghost small" data-a="reset">Karriere neu starten</button></div><p class="mini-note">Nebenauftrag einmal pro drei neue Auktionslose. Alle Preise und Beträge sind ausschließlich Spielgeld – keine echten Käufe.</p>`}
function nav(){document.getElementById('nav').innerHTML=`<div class="nav-wrap">${[['auction','🔨','Auktion'],['garage','🚘','Garage'],['empire','🏆','Imperium']].map(([id,ic,t])=>`<button data-a="tab" data-tab="${id}" class="${screen===id?'active':''}" aria-label="${t}"><span>${ic}</span>${t}</button>`).join('')}</div>`}
function render(){document.getElementById('app').innerHTML=head()+(screen==='auction'?auction():screen==='garage'?garage():empire());nav()}
function ask(title,body,buttons){modal=true;document.getElementById('popup').innerHTML=`<div class="modalbg"><div class="modal" role="dialog" aria-modal="true"><h2>${title}</h2><p>${body}</p><div class="btnrow">${buttons.map((b,i)=>`<button class="btn ${b.alt?'alt':''}" data-a="modal" data-choice="${i}">${b.label}</button>`).join('')}</div></div></div>`;modal=buttons}
function close(){modal=null;document.getElementById('popup').innerHTML=''}
function find(id){return s.garage.find(c=>c.id===id)}
function won(){let c=s.offer;if(s.garage.length>=s.capacity){notif('Garage voll – erst einen Stellplatz freimachen!');return}if(s.cash<c.bid){notif('Zu wenig Geld für den Zuschlag!');return}s.cash-=c.bid;let bought={...c,price:c.bid,basis:c.bid+(c.inspectionFee||0),spots:4,cleaned:false,negotiated:false};s.garage.push(bought);nextOffer();screen='garage';save();render();notif('🔑 Zuschlag! Dein Auto steht in der Garage.')}
function sellCar(c,price){let profit=price-(c.basis||c.price);s.cash+=price;s.profit+=profit;s.sales++;s.history.unshift({name:CARS[c.model].name,profit});s.history=s.history.slice(0,12);s.garage=s.garage.filter(v=>v.id!==c.id);save();render();notif(`${profit>=0?'✅ Gewinn':'⚠️ Verlust'}: ${profit>=0?'+':''}${money(profit)}`)}
function action(el){let a=el.dataset.a,id=Number(el.dataset.id),c=find(id),part=PARTS.find(p=>p.id===el.dataset.part);
if(a==='tab'){screen=el.dataset.tab;render();window.scrollTo(0,0);return}
if(a==='modal'){let n=Number(el.dataset.choice),b=modal&&modal[n];close();if(b&&b.fn)b.fn();return}
if(a==='skip'){nextOffer();render();notif('Nächstes Fahrzeug auf der Auktion.');return}
if(a==='inspect'){let o=s.offer;if(o.inspected)return;let cost=Math.max(90,240-s.inspector*50);if(s.cash<cost){notif('Zu wenig Spielgeld für die Prüfung.');return}o.inspected=true;o.inspectionFee=cost;s.cash-=cost;s.inspections++;save();render();notif('Schäden aufgedeckt – jetzt kennst du das Risiko.');return}
if(a==='bid'||a==='bigbid'){let o=s.offer;if(s.garage.length>=s.capacity){notif('Deine Garage ist voll!');return}let offered=o.bid+o.step*(a==='bigbid'?2:1);if(offered>s.cash){notif('Nicht genug Spielgeld für dieses Gebot.');return}o.bid=offered;o.round++;let rivalsStay=(o.round<2?Math.random()<.72:o.round<4?Math.random()<.42:false);if(rivalsStay&&o.bid+o.step<=s.cash){o.bid+=o.step;o.leader='rival';save();render();notif('🔴 Der Konkurrent hat dich überboten!')}else{save();won()}return}
if(a==='wash'&&c){c.spots=clamp((c.spots??4)-1,0,4);if(c.spots===0&&!c.cleaned){c.cleaned=true;s.cleaned++;notif('✨ Aufbereitung abgeschlossen! +400 € Fahrzeugwert.')}save();render();return}
if(a==='repair-menu'&&c&&part){let full=repairPrice(c,part),inc=Math.min(30,100-c.parts[part.id]),budget=Math.max(120,Math.round(full*(inc/(100-c.parts[part.id]))*.82/10)*10);ask(`${part.icon} ${part.name}`,`Der Zustand liegt bei <b>${c.parts[part.id]}%</b>.<br><br><b>Teilreparatur:</b> +${inc} Punkte für ${money(budget)}.<br><b>Komplettreparatur:</b> auf 100% für ${money(full)}.`,[{label:`Teil · ${money(budget)}`,fn:()=>repair(c,part,budget,inc)},{label:`Voll · ${money(full)}`,fn:()=>repair(c,part,full,100-c.parts[part.id])}]);return}
if(a==='sell'&&c){let val=round50(saleVal(c)*.94);ask('Sofort verkaufen?',`Der Händler zahlt dir <b>${money(val)}</b> für den ${CARS[c.model].name}.<br>Erwartete Marge: <b>${money(val-(c.basis||c.price))}</b>.`,[{label:'Abbrechen',alt:true},{label:'Verkaufen',fn:()=>sellCar(c,val)}]);return}
if(a==='negotiate'&&c&&!c.negotiated){ask('Mit Käufer verhandeln?',`Du verlangst <b>${money(round50(saleVal(c)*1.06))}</b>. Der Käufer akzeptiert mit einer Chance von 60%. Bei Ablehnung bleibt der Sofortverkauf möglich, aber die Verhandlung ist verbraucht.`,[{label:'Abbrechen',alt:true},{label:'Verhandeln',fn:()=>{c.negotiated=true;if(Math.random()<.6){sellCar(c,round50(saleVal(c)*1.06))}else{save();render();notif('Der Käufer lehnt ab. Sofortverkauf bleibt möglich.')}}}]);return}
if(a==='upgrade'){let type=el.dataset.type,price=type==='capacity'?4500+(s.capacity-2)*3100:2800+s.inspector*1850;if(type==='inspector'&&s.inspector>=3)return;if(s.cash<price){notif('Dafür reicht das Kapital nicht.');return}s.cash-=price;if(type==='capacity')s.capacity++;else s.inspector++;s.upgrades++;save();render();notif('Upgrade gekauft!');return}
if(a==='job'){let t=s.jobTurn??-10;if(s.turn-t<3){notif('Wieder verfügbar nach drei neuen Auktionslosen.');return}s.cash+=450;s.jobTurn=s.turn;save();render();notif('Nebenauftrag erledigt: +450 €');return}
if(a==='reset'){ask('Neues Spiel beginnen?',`Alle Fortschritte in Version 0.2 werden gelöscht. Das lässt sich nicht rückgängig machen.`,[{label:'Abbrechen',alt:true},{label:'Neustart',fn:()=>{s=fresh();nextOffer();screen='auction';save();render();notif('Neue Karriere gestartet.')}}]);return}
}
function repair(c,p,cost,points){if(s.cash<cost){notif('Nicht genug Geld für die Reparatur.');return}c.parts[p.id]=Math.min(100,c.parts[p.id]+points);c.basis=(c.basis||c.price)+cost;s.cash-=cost;save();render();notif(`${p.name}: Zustand verbessert!`)}
document.addEventListener('click',e=>{let el=e.target.closest('[data-a]');if(!el)return;e.preventDefault();action(el)});
render();
})();
</script>
</body>
</html>
