<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#101726"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>AUTOFLIP · Garage Empire</title>
<style>
:root{--bg:#0b1120;--paper:#131d30;--card:#19253a;--line:#293751;--muted:#98aac4;--ink:#f5f7fe;--gold:#ffd279;--cyan:#48d9da;--green:#59ddb0;--red:#ff8091;--radius:19px;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}body{background:radial-gradient(ellipse at 50% -25%,#213856 0%,transparent 55%),var(--bg);overflow-x:hidden}button{font:inherit;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.45;cursor:default}.app{max-width:520px;margin:0 auto;padding:calc(17px + env(safe-area-inset-top)) 16px calc(112px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px}.brand{font-weight:1000;font-style:italic;letter-spacing:-1.1px;font-size:27px;line-height:1}.brand b{color:var(--gold)}.brand-small{font-size:10px;letter-spacing:2.2px;font-style:normal;color:var(--muted);font-weight:700;margin-top:5px}.wallet{text-align:right;border:1px solid #39465e;background:#182538;border-radius:14px;padding:8px 12px;min-width:128px}.wallet small{display:block;color:var(--muted);font-size:10px;letter-spacing:.8px}.wallet strong{display:block;color:var(--gold);font-size:18px;font-variant-numeric:tabular-nums}.eyebrow{font-weight:800;text-transform:uppercase;letter-spacing:1.8px;color:#90a1b8;font-size:10px;margin-bottom:7px}.hero-title{font-size:24px;font-weight:900;letter-spacing:-.5px;margin:0 0 4px}.sub{color:var(--muted);font-size:12px;line-height:1.6;margin:0}.badge{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:900;letter-spacing:.4px;padding:6px 9px;border-radius:99px;background:#233347;color:#bcd4ed}.badge.gold{color:var(--gold);background:#483b26}.badge.green{color:var(--green);background:#173c37}.badge.red{color:var(--red);background:#492835}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:16px 1px 9px}.sectionhead h2{font-size:17px;letter-spacing:-.3px;margin:0}.card{background:linear-gradient(160deg,#1a2941,#131d30);border:1px solid #2a3952;border-radius:var(--radius);box-shadow:0 14px 28px #0409164d;overflow:hidden;position:relative}.card-body{padding:17px}.stage{height:198px;overflow:hidden;position:relative;background:radial-gradient(ellipse at 50% 80%,#49657d 0%,#243c56 42%,#16253b 100%)}.stage:before{content:"";position:absolute;inset:0;background:linear-gradient(transparent 64%,#1a293a 64%,#233447 67%,#182337 67%,#182337 100%)}.stage:after{content:"";position:absolute;left:0;right:0;bottom:31px;height:3px;background:repeating-linear-gradient(90deg,#d4ddea99 0 21px,transparent 21px 45px);opacity:.45}.car-svg{position:absolute;bottom:21px;left:1%;width:98%;height:162px;filter:drop-shadow(0 12px 6px #02070d80);z-index:2}.car-small{height:103px}.stage.small{height:130px}.stage.small .car-svg{height:103px;bottom:12px}.stage.small:after{bottom:20px}.city{position:absolute;inset:0;opacity:.65;background:linear-gradient(90deg,transparent 4%,#344d66 4% 9%,transparent 9% 17%,#344e65 17% 27%,transparent 27% 33%,#3b526a 33% 44%,transparent 44% 58%,#354b63 58% 67%,transparent 67% 74%,#344a62 74% 84%,transparent 84%),linear-gradient(0deg,#112138 35%,transparent 35%);clip-path:polygon(0 33%,9% 33%,9% 18%,25% 18%,25% 39%,42% 39%,42% 8%,58% 8%,58% 30%,74% 30%,74% 16%,88% 16%,88% 44%,100% 44%,100% 100%,0 100%)}.tag-corner{position:absolute;top:13px;left:13px;z-index:3}.tag-right{position:absolute;top:13px;right:13px;z-index:3}.carname{font-size:22px;font-weight:900;letter-spacing:-.4px;margin:0}.model{color:var(--muted);font-size:11px;margin-top:3px}.pricerow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.info{padding:12px;border-radius:13px;background:#0e1829;border:1px solid #263549}.info small{display:block;color:var(--muted);font-size:10px;margin-bottom:7px}.info strong{font-size:20px;font-weight:900;letter-spacing:-.5px;white-space:nowrap}.info strong.goldtxt{color:var(--gold)}.facts{display:flex;gap:7px;flex-wrap:wrap;margin:9px 0 14px}.fact{border-radius:7px;background:#26364a;padding:7px 9px;color:#c8d8eb;font-size:11px;font-weight:700}.hint{font-size:12px;color:#b8c8dc;line-height:1.6;background:#101b2d;border-left:3px solid #647d9f;padding:10px 12px;border-radius:0 10px 10px 0}.report{padding:12px 14px;border:1px solid #34505b;background:#142b30;border-radius:12px;margin-top:11px}.report-title{font-size:11px;font-weight:900;letter-spacing:.5px;color:#87ead2;margin-bottom:9px}.report-row{display:flex;justify-content:space-between;font-size:12px;padding:5px 0;color:#c4d5e9}.report-row strong{color:#fff}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.btn{border:0;border-radius:13px;padding:15px 10px;background:var(--gold);color:#251b0b;font-weight:900;font-size:13px;min-height:47px;box-shadow:0 5px 18px #d4a84420;transition:transform .12s}.btn:active{transform:scale(.974)}.btn.secondary{background:#2b3b52;color:#eaf2ff;box-shadow:none}.btn.outline{background:transparent;border:1px solid #435675;color:#e8f1ff;box-shadow:none}.btn.green{background:var(--green);color:#072519}.btn.wide{width:100%}.divider{border-top:1px solid #2d3b52;margin:16px 0}.line2{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:9px 0}.line2 span{color:var(--muted);font-size:12px}.line2 strong{font-size:13px}.garage-title{display:flex;gap:8px;justify-content:space-between;align-items:center;margin:13px 0}.garage-title h3{margin:0;font-size:18px}.garage-car{margin:12px 0 16px}.stats{display:grid;gap:9px}.stat-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;font-size:11px}.stat-top span{color:var(--muted)}.bar{height:7px;border-radius:50px;background:#0a1525;overflow:hidden}.bar>div{height:100%;border-radius:50px;background:linear-gradient(90deg,#26b49f,#79f0ae)}.bar.warn>div{background:linear-gradient(90deg,#ff6a77,#ffce6b)}.repair-list{display:grid;gap:8px;margin-top:14px}.repair-row{display:grid;grid-template-columns:1fr auto;gap:9px;align-items:center;background:#101c2e;border:1px solid #304058;padding:9px 9px 9px 12px;border-radius:12px}.repair-row strong{font-size:12px}.repair-row small{color:var(--muted);font-size:10px;display:block;margin-top:3px}.repair-row button{min-width:113px;padding:10px 8px;font-size:11px;min-height:37px;border-radius:9px}.empty{text-align:center;padding:30px 20px;border:1px dashed #43546a;border-radius:18px;background:#101b2b}.empty .emoji{font-size:42px;margin-bottom:8px}.empty strong{font-size:17px}.empty p{color:var(--muted);font-size:12px;line-height:1.7}.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kpi{background:#111e30;border:1px solid #30415a;border-radius:13px;padding:15px}.kpi small{color:var(--muted);font-size:11px}.kpi strong{display:block;margin-top:6px;font-size:22px;font-variant-numeric:tabular-nums}.upgrade{display:flex;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid #2e3e53}.upgrade-icon{height:41px;min-width:41px;display:flex;align-items:center;justify-content:center;border-radius:13px;background:#2d3f55;font-size:21px}.upgrade-text{flex:1}.upgrade-text strong{display:block;font-size:13px}.upgrade-text small{display:block;color:var(--muted);font-size:11px;margin-top:5px;line-height:1.5}.upgrade .btn{padding:10px;min-height:38px;font-size:11px}.bottom{position:fixed;z-index:20;bottom:0;left:0;right:0;background:#0f1929ed;backdrop-filter:blur(16px);border-top:1px solid #30405a;padding:9px max(12px,calc((100vw - 520px)/2 + 12px)) calc(9px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.nav{background:none;border:0;color:#8ba0bb;padding:8px 4px;border-radius:12px;display:grid;justify-items:center;gap:5px;font-size:10px;font-weight:800}.nav.active{color:var(--gold);background:#26374b}.nav svg{width:23px;height:23px}.toast{position:fixed;z-index:50;left:50%;bottom:calc(98px + env(safe-area-inset-bottom));width:calc(100% - 36px);max-width:460px;transform:translateX(-50%) translateY(20px);background:#e7effb;color:#182236;padding:13px 17px;border-radius:14px;font-size:13px;font-weight:800;opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;box-shadow:0 9px 36px #050b18aa}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.modal-back{position:fixed;inset:0;z-index:30;background:#040810b8;display:flex;align-items:flex-end;justify-content:center;padding:16px 15px calc(22px + env(safe-area-inset-bottom))}.modal{width:100%;max-width:470px;background:#1a2940;border:1px solid #4c617e;border-radius:22px;padding:22px;box-shadow:0 12px 60px #0009}.modal h2{margin:0 0 8px}.modal p{color:#b9cce2;font-size:13px;line-height:1.6}.modal .actions{margin-top:20px}.smallprint{color:#7186a1;font-size:10px;line-height:1.6;margin-top:18px}.help{padding:13px 15px;background:#17263c;border:1px solid #2a4160;border-radius:12px;color:#b9cbe2;font-size:11px;line-height:1.65;margin-top:14px}.pulse{animation:pulse 1.6s ease-in-out infinite}@keyframes pulse{50%{box-shadow:0 0 0 4px #ffcf6540}}@media (min-width:700px){.app{padding-top:26px}.bottom{max-width:520px;margin:auto;border-left:1px solid #30405a;border-right:1px solid #30405a;border-radius:16px 16px 0 0}}
</style>
</head>
<body><div id="app" class="app"></div><div id="toast" class="toast" role="status" aria-live="polite"></div><div id="dialog"></div>
<script>
(()=>{
'use strict';
const KEY='autoflip-v01-save';
const CATALOG=[
 {name:'Kavo Urban',type:'Stadtauto',value:7800,color:'#ffb957',tier:0,shape:'compact'},
 {name:'Nordline 160',type:'Limousine',value:12300,color:'#63c9d7',tier:0,shape:'sedan'},
 {name:'Vexa GT',type:'Sportcoupé',value:18900,color:'#e76d7e',tier:1,shape:'sport'},
 {name:'Ravon X4',type:'SUV',value:25400,color:'#84bb88',tier:1,shape:'suv'},
 {name:'Falcon RS',type:'Sportwagen',value:43500,color:'#b3a5fc',tier:2,shape:'sport'},
 {name:'Veloré Classic',type:'Klassiker',value:32700,color:'#d29b69',tier:2,shape:'sedan'}
];
const COMPONENTS=[{id:'motor',name:'Motor & Getriebe',icon:'⚙️',ratio:.34,weight:.43},{id:'body',name:'Karosserie & Lack',icon:'🛠️',ratio:.19,weight:.34},{id:'electro',name:'Elektronik',icon:'⚡',ratio:.13,weight:.23}];
const euro=n=>Math.round(n).toLocaleString('de-DE')+' €';
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
let tab='auction',modal=null,toastHandle=null;
function seed(){return {cash:12500,garage:[],capacity:2,inspector:0,reputation:1,sales:0,profit:0,spent:0,earned:0,turn:0,offer:null,nextid:1,history:[],fresh:true,lastJobTurn:-10}}
function load(){try{const raw=localStorage.getItem(KEY);if(!raw)return seed();const parsed=JSON.parse(raw);if(!parsed||!Array.isArray(parsed.garage)||typeof parsed.cash!=='number')return seed();return Object.assign(seed(),parsed)}catch(e){return seed()}}
let state=load();
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function newOffer(){
 const affordable=CATALOG.filter((m)=>m.value*.64<state.cash*1.23 || state.sales>=4);
 const pool=affordable.length?affordable:CATALOG.slice(0,2);
 let model=pool[rand(0,pool.length-1)];
 const parts={motor:rand(25,96),body:rand(30,96),electro:rand(25,97)};
 const condition=partCondition(parts);
 const price=Math.round(model.value*(.26+.55*condition/100)*rand(89,108)/100/50)*50;
 const valueFactor=rand(96,105)/100;
 const mileage=rand(35,225)*1000;
 const notes=['Verkauf aus Privatbesitz. Zustand unbekannt.','Laut Verkäufer fahrbereit. Keine Garantie.','Steht länger in einer Garage.','Optisch gepflegt, technische Prüfung empfohlen.','Verkauf wie gesehen. Schneller Zuschlag möglich.'];
 state.offer={id:state.nextid++,model:CATALOG.indexOf(model),parts,price,valueFactor,mileage,note:notes[rand(0,notes.length-1)],inspected:false};
 state.turn++;persist();
}
function partCondition(parts){return COMPONENTS.reduce((s,p)=>s+parts[p.id]*p.weight,0)}
function saleValue(car){const model=CATALOG[car.model],condition=partCondition(car.parts);return Math.round(model.value*(.21+.79*condition/100)*car.valueFactor/50)*50}
function repairPrice(car,part){const damage=100-car.parts[part.id];return Math.round((CATALOG[car.model].value*part.ratio*(damage/100)+100)/10)*10}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastHandle);toastHandle=setTimeout(()=>el.classList.remove('show'),2700)}
function carArt(car,small=false){const model=CATALOG[car.model];const color=model.color;const isSUV=model.shape==='suv',isSport=model.shape==='sport';const roof=isSUV?'M 138 126 L 185 56 Q 194 48 213 48 L 363 48 Q 381 49 395 65 L 431 126 Z':isSport?'M 146 134 L 221 79 Q 233 72 258 72 L 355 77 Q 365 79 380 93 L 412 131 Z':'M 132 130 L 193 72 Q 204 64 229 64 L 339 64 Q 357 66 372 84 L 412 129 Z';return `<div class="stage${small?' small':''}"><div class="city"></div><svg class="car-svg" viewBox="0 0 560 225" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration: ${model.name}"><ellipse cx="285" cy="193" rx="235" ry="15" fill="#08101b" opacity=".55"/><path d="${roof}" fill="${color}" stroke="#ecfaff44" stroke-width="3"/><path d="M 205 72 L 225 71 Q 236 68 254 68 L 334 71 Q 350 72 361 88 L 376 122 L 168 122 Z" fill="#1e364b" opacity=".95" transform="${isSport?'translate(8 5)':'translate(0 0)'}"/><path d="M 256 70 L 256 125" stroke="#d9eefa" opacity=".5" stroke-width="4"/><path d="M 79 132 Q 98 123 140 125 L 417 123 Q 443 125 477 146 L 503 153 Q 514 161 513 179 L 509 187 L 65 187 Q 51 181 54 159 L 61 143 Q 66 137 79 132 Z" fill="${color}" stroke="#ffffff66" stroke-width="2"/><path d="M 74 153 Q 225 141 493 155" stroke="#ffffff" stroke-width="3" opacity=".25" fill="none"/><path d="M 60 170 L 86 167 L 83 179 L 59 177 Z" fill="#dceefa"/><path d="M 483 159 L 509 164 L 513 177 L 489 173 Z" fill="#ff7770"/><path d="M 87 186 L 499 186" stroke="#111b28" stroke-width="9" stroke-linecap="round"/><g><circle cx="153" cy="184" r="33" fill="#0a111a"/><circle cx="153" cy="184" r="22" fill="#8898a9"/><circle cx="153" cy="184" r="14" fill="#394a61"/><circle cx="153" cy="184" r="5" fill="#d4e5f0"/><circle cx="421" cy="184" r="33" fill="#0a111a"/><circle cx="421" cy="184" r="22" fill="#8898a9"/><circle cx="421" cy="184" r="14" fill="#394a61"/><circle cx="421" cy="184" r="5" fill="#d4e5f0"/></g><path d="M 276 148 L 308 148" stroke="#162438" stroke-width="4" stroke-linecap="round"/><path d="M 400 151 L 422 151" stroke="#162438" stroke-width="4" stroke-linecap="round"/></svg></div>`}
function header(){return `<div class="top"><div><div class="brand">AUTO<b>FLIP</b></div><div class="brand-small">GARAGE EMPIRE · ALPHA 0.1</div></div><div class="wallet"><small>DEIN KAPITAL</small><strong>${euro(state.cash)}</strong></div></div>`}
function auction(){const car=state.offer,m=CATALOG[car.model];return `<div class="eyebrow">FAHRZEUGBÖRSE • ANGEBOT #${String(state.turn).padStart(3,'0')}</div><h1 class="hero-title">Finde deinen nächsten Deal.</h1><p class="sub">Prüfe das Risiko, sichere dir das Auto und verkaufe es mit Gewinn.</p><div style="height:14px"></div><div class="card">${carArt(car)}<div class="tag-corner"><span class="badge gold">★ ${m.type}</span></div><div class="tag-right"><span class="badge">${car.mileage.toLocaleString('de-DE')} km</span></div><div class="card-body"><h2 class="carname">${m.name}</h2><div class="model">${car.note}</div><div class="pricerow"><div class="info"><small>SOFORTZUSCHLAG</small><strong class="goldtxt">${euro(car.price)}</strong></div><div class="info"><small>TOP-MARKTWERT*</small><strong>${euro(m.value)}</strong></div></div><div class="facts"><span class="fact">🔍 ${car.inspected?'Geprüft':'Zustand unbekannt'}</span><span class="fact">🚘 ${m.type}</span><span class="fact">🧰 Reparierbar</span></div><div class="hint">*Der Top-Marktwert gilt nur bei sehr gutem Zustand. Tatsächlicher Verkaufspreis kann deutlich niedriger liegen.</div>${car.inspected?report(car):''}<div class="actions"><button class="btn secondary" data-action="inspect">${car.inspected?'✓ Bericht vorhanden':'🔍 Prüfen · '+euro(inspectCost())}</button><button class="btn" data-action="buy">Zuschlag sichern →</button></div><button class="btn outline wide" style="margin-top:10px" data-action="skip">Nächstes Angebot ↻</button></div></div><div class="help">💡 <b>Tipp:</b> Im ersten Schritt kannst du kostenlos beliebig viele Auktionen durchsehen. Eine Fahrzeugprüfung kostet Spielgeld, kann aber vor teuren Fehlkäufen schützen.</div>`}
function inspectCost(){return Math.max(60,260-state.inspector*75)}
function report(car){return `<div class="report"><div class="report-title">✓ TECHNISCHER PRÜFBERICHT</div>${COMPONENTS.map(p=>`<div class="report-row"><span>${p.icon} ${p.name}</span><strong style="color:${car.parts[p.id]<50?'var(--red)':'var(--green)'}">${car.parts[p.id]} / 100</strong></div>`).join('')}<div class="divider" style="margin:9px 0"></div><div class="report-row"><span>Verkauf im Ist-Zustand</span><strong>${euro(saleValue(car))}</strong></div><div class="report-row"><span>Reparaturen insgesamt</span><strong>${euro(COMPONENTS.reduce((s,p)=>s+(car.parts[p.id]===100?0:repairPrice(car,p)),0))}</strong></div></div>`}
function garage(){return `<div class="eyebrow">DEIN AUTOHANDEL</div><h1 class="hero-title">Meine Garage</h1><p class="sub">${state.garage.length} von ${state.capacity} Stellplätzen belegt. Repariere gezielt, bevor du verkaufst.</p>${state.garage.length?state.garage.map(c=>garageCard(c)).join(''):`<div style="height:16px"></div><div class="empty"><div class="emoji">🚘</div><strong>Noch kein Auto in der Garage</strong><p>Gehe zur Auktion und sichere dir dein erstes Fahrzeug. Danach entscheidest du über Reparaturen und Verkauf.</p><button class="btn" data-action="tab" data-tab="auction">Zur Auktion →</button></div>`}`}
function garageCard(car){const m=CATALOG[car.model], sale=saleValue(car), profit=sale-(car.basis||car.price);return `<div class="card garage-car">${carArt(car,true)}<div class="card-body"><div class="garage-title"><div><h3>${m.name}</h3><div class="model">Einkauf: ${euro(car.price)} · Investiert: ${euro(car.basis)}</div></div><span class="badge ${profit>=0?'green':'red'}">${profit>=0?'+':''}${euro(profit)}</span></div><div class="stats">${COMPONENTS.map(p=>`<div><div class="stat-top"><span>${p.icon} ${p.name}</span><strong>${car.parts[p.id]}%</strong></div><div class="bar ${car.parts[p.id]<50?'warn':''}"><div style="width:${car.parts[p.id]}%"></div></div></div>`).join('')}</div><div class="repair-list">${COMPONENTS.map(p=>`<div class="repair-row"><div><strong>${p.name} reparieren</strong><small>${car.parts[p.id]===100?'Bereits vollständig instand gesetzt':'Verbessert den Fahrzeugwert'}</small></div><button class="btn secondary" data-action="repair" data-id="${car.id}" data-part="${p.id}" ${car.parts[p.id]===100?'disabled':''}>${car.parts[p.id]===100?'✓ Fertig':euro(repairPrice(car,p))}</button></div>`).join('')}</div><div class="pricerow" style="margin-bottom:0"><div class="info"><small>AKTUELLER VERKAUFSWERT</small><strong>${euro(sale)}</strong></div><div class="info"><small>MÖGLICHER GEWINN / VERLUST</small><strong style="color:${profit>=0?'var(--green)':'var(--red)'}">${profit>=0?'+':''}${euro(profit)}</strong></div></div><button class="btn green wide" data-action="sell" data-id="${car.id}" style="margin-top:13px">Für ${euro(sale)} verkaufen →</button></div></div>`}
function office(){const capacityPrice=4500+(state.capacity-2)*3100,inspectPrice=2800+state.inspector*1850;const progress=state.sales%3;return `<div class="eyebrow">UNTERNEHMENSAUFBAU</div><h1 class="hero-title">Dein Autohandel</h1><p class="sub">Jeder gute Deal bringt dich deinem eigenen Autoimperium näher.</p><div class="sectionhead"><h2>Geschäftszahlen</h2><span class="badge gold">Ruf-Stufe ${state.reputation}</span></div><div class="stat-grid"><div class="kpi"><small>Verkaufte Fahrzeuge</small><strong>${state.sales}</strong></div><div class="kpi"><small>Gesamter Handelsgewinn</small><strong style="color:${state.profit>=0?'var(--green)':'var(--red)'}">${state.profit>=0?'+':''}${euro(state.profit)}</strong></div><div class="kpi"><small>Garage</small><strong>${state.garage.length} / ${state.capacity}</strong></div><div class="kpi"><small>Prüfgebühr</small><strong>${euro(inspectCost())}</strong></div></div><div class="sectionhead"><h2>Verbesserungen</h2></div><div class="card"><div class="card-body"><div class="upgrade"><div class="upgrade-icon">🏚️</div><div class="upgrade-text"><strong>Zusätzlicher Stellplatz</strong><small>Du kannst ein weiteres Fahrzeug gleichzeitig besitzen.</small></div><button class="btn secondary" data-action="upgrade" data-kind="garage">${euro(capacityPrice)}</button></div><div class="upgrade" style="border-bottom:0"><div class="upgrade-icon">🔬</div><div class="upgrade-text"><strong>Diagnosegerät Stufe ${state.inspector}</strong><small>Senkt die Kosten künftiger Prüfungen um 75 €.</small></div><button class="btn secondary" data-action="upgrade" data-kind="inspect" ${state.inspector>=3?'disabled':''}>${state.inspector>=3?'MAX':euro(inspectPrice)}</button></div></div></div><div class="sectionhead"><h2>Werkstatt-Nebenjob</h2></div><div class="card"><div class="card-body"><strong>Fahrzeug aufbereiten · +850 €</strong><p class="sub" style="margin:8px 0 12px">Kleine Zusatzaufträge sichern deine Firma gegen eine Pleite ab. Nach einem Auftrag musst du drei neue Auktionen ansehen, bevor der nächste verfügbar ist.</p><button class="btn secondary wide" data-action="job" ${state.turn-state.lastJobTurn<3?'disabled':''}>${state.turn-state.lastJobTurn<3?'In '+(3-(state.turn-state.lastJobTurn))+' Auktionen wieder verfügbar':'Auftrag erledigen · +850 €'}</button></div></div><div class="sectionhead"><h2>Dein nächstes Ziel</h2></div><div class="card"><div class="card-body"><div class="line2"><strong>3 Fahrzeuge verkaufen</strong><span>${progress} / 3</span></div><div class="bar"><div style="width:${progress/3*100}%"></div></div><p class="sub" style="margin-top:10px">Nach jeweils drei Verkäufen bekommst du einen Treuebonus aus Spielgeld und steigst eine Ruf-Stufe auf.</p><span class="badge gold" style="margin-top:12px">Nächster Bonus: ${euro(1600+state.reputation*400)}</span></div></div>${state.history.length?`<div class="sectionhead"><h2>Letzte Verkäufe</h2></div><div class="card"><div class="card-body">${state.history.slice(0,5).map(h=>`<div class="line2"><span>${h.name}</span><strong style="color:${h.profit>=0?'var(--green)':'var(--red)'}">${h.profit>=0?'+':''}${euro(h.profit)}</strong></div>`).join('')}</div></div>`:''}<div class="help">ℹ️ Alle Beträge sind reines Spielgeld. AUTOFLIP 0.1 ist eine kostenlose lokale Demo ohne Werbung, echte Zahlungen oder Server.</div><button class="btn outline wide" style="margin-top:18px" data-action="reset">↺ Neues Spiel starten</button><div class="smallprint">Testversion · Spielstand wird nur in diesem Browser auf diesem Gerät gespeichert. Löschen von Website-Daten kann den Spielstand entfernen.</div>`}
const navIcons={auction:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 2-5h14l2 5-2 3H5z"/><path d="M5 12v7M19 12v7M5 16h14"/><circle cx="8" cy="13" r="1"/><circle cx="16" cy="13" r="1"/></svg>',garage:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20V8l9-5 9 5v12M3 10h18M7 20v-7h10v7M7 16h10"/></svg>',office:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18M6 20V9l6-5 6 5v11M9 20v-6h6v6M9 10h6"/></svg>'};
function render(){const app=document.getElementById('app');app.innerHTML=header()+(tab==='auction'?auction():tab==='garage'?garage():office());let b=document.querySelector('.bottom');if(!b){b=document.createElement('nav');b.className='bottom';b.setAttribute('aria-label','Hauptnavigation');document.body.appendChild(b)}b.innerHTML=[['auction','Auktion'],['garage','Garage'],['office','Büro']].map(([id,name])=>`<button class="nav ${tab===id?'active':''}" data-action="tab" data-tab="${id}" aria-current="${tab===id?'page':'false'}">${navIcons[id]}<span>${name}</span></button>`).join('');}
function dialog(title,body,yes){modal=yes;document.getElementById('dialog').innerHTML=`<div class="modal-back"><div class="modal" role="dialog" aria-modal="true"><h2>${title}</h2><p>${body}</p><div class="actions"><button class="btn secondary" data-action="cancel">Abbrechen</button><button class="btn green" data-action="confirm">Bestätigen</button></div></div></div>`}
function closeDialog(){modal=null;document.getElementById('dialog').innerHTML=''}
function onAction(el){const action=el.dataset.action,id=Number(el.dataset.id);
 if(action==='tab'){tab=el.dataset.tab;render();window.scrollTo({top:0,behavior:'instant'});return}
 if(action==='skip'){newOffer();render();toast('Neues Auktionsangebot!');return}
 if(action==='inspect'){let o=state.offer;if(o.inspected){toast('Der Prüfbericht liegt bereits vor.');return};let cost=inspectCost();if(state.cash<cost){toast('Nicht genug Spielgeld für die Prüfung.');return}state.cash-=cost;state.spent+=cost;o.inspected=true;o.inspectionFee=cost;persist();render();toast('Alle Mängel aufgedeckt.');return}
 if(action==='buy'){let o=state.offer;if(state.garage.length>=state.capacity){tab='garage';render();toast('Garage voll. Verkaufe erst ein Auto.');return}if(o.price>state.cash){toast('Nicht genug Spielgeld für den Zuschlag.');return}state.cash-=o.price;state.spent+=o.price;state.garage.push({...o,price:o.price,basis:o.price+(o.inspectionFee||0)});newOffer();tab='garage';persist();render();window.scrollTo({top:0,behavior:'instant'});toast('Zuschlag! Dein Fahrzeug steht in der Garage.');return}
 if(action==='repair'){const car=state.garage.find(c=>c.id===id),p=COMPONENTS.find(c=>c.id===el.dataset.part);if(!car||!p)return;if(car.parts[p.id]===100)return;const price=repairPrice(car,p);if(price>state.cash){toast('Nicht genügend Kapital für die Reparatur.');return}state.cash-=price;state.spent+=price;car.basis+=price;car.parts[p.id]=100;persist();render();toast(p.name+' vollständig repariert!');return}
 if(action==='sell'){const car=state.garage.find(c=>c.id===id);if(!car)return;const val=saleValue(car),profit=val-car.basis;dialog('Fahrzeug verkaufen?',`Du verkaufst deinen <b>${CATALOG[car.model].name}</b> für <b>${euro(val)}</b>. Dein Handels${profit>=0?'gewinn':'verlust'} beträgt <b style="color:${profit>=0?'#6de3b0':'#ff8091'}">${profit>=0?'+':''}${euro(profit)}</b>.`,()=>{state.cash+=val;state.earned+=val;state.profit+=profit;state.sales++;state.history.unshift({name:CATALOG[car.model].name,profit});state.history=state.history.slice(0,12);state.garage=state.garage.filter(c=>c.id!==id);let bonus=0;if(state.sales%3===0){bonus=1600+state.reputation*400;state.cash+=bonus;state.reputation++}persist();tab='office';render();toast('Verkauft: '+(profit>=0?'+':'')+euro(profit)+(bonus?' · Bonus '+euro(bonus):''))});return}
 if(action==='upgrade'){const type=el.dataset.kind,price=type==='garage'?4500+(state.capacity-2)*3100:2800+state.inspector*1850;if(type==='inspect'&&state.inspector>=3)return;if(state.cash<price){toast('Dafür reicht dein Spielgeld noch nicht.');return}state.cash-=price;state.spent+=price;if(type==='garage')state.capacity++;else state.inspector++;persist();render();toast('Verbesserung freigeschaltet!');return}
 if(action==='job'){if(state.turn-state.lastJobTurn<3){toast('Diesen Auftrag gibt es erst nach weiteren Auktionen.');return}state.lastJobTurn=state.turn;state.cash+=850;persist();render();toast('Fahrzeug aufbereitet: +850 € Spielgeld!');return}
 if(action==='reset'){dialog('Neues Spiel starten?', 'Dein bisheriger Spielstand wird durch eine neue Karriere mit 12.500 € Startkapital ersetzt. Das lässt sich nicht rückgängig machen.',()=>{state=seed();newOffer();tab='auction';persist();render();toast('Neue Karriere gestartet!')});return}
 if(action==='cancel'){closeDialog();return}
 if(action==='confirm'){const fn=modal;closeDialog();if(fn)fn();return}
}
document.addEventListener('click',(e)=>{const el=e.target.closest('[data-action]');if(el){e.preventDefault();onAction(el)}});
if(!state.offer)newOffer();render();
})();
</script>
</body></html>
